name: Build Vibely APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Optional: Settings -> Secrets and variables -> Actions -> Variables -> VIBELY_BACKEND_URL
  VIBELY_BACKEND_URL: ${{ vars.VIBELY_BACKEND_URL }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android folder
        run: |
          # If a Vibely*.zip is in the repo, unzip the newest one. Otherwise use the repo files directly.
          Z=$(find . -maxdepth 1 -iname 'Vibely*.zip' | sort -V | tail -n 1 || true)
          if [ -n "$Z" ]; then
            echo "Using $Z"
            unzip -q -o "$Z" -d project
            SRC=project
          else
            echo "No zip found, using repo files"
            SRC=.
          fi
          # Pick the shallowest settings.gradle(.kts)
          F=$(find "$SRC" -name 'settings.gradle*' -not -path '*/__MACOSX/*' -not -path '*/node_modules/*' | awk '{print length($0) " " $0}' | sort -n | sed -n 1p | cut -d' ' -f2-)
          if [ -z "$F" ]; then echo "::error::settings.gradle not found"; exit 1; fi
          D=$(dirname "$F")
          echo "ANDROID_DIR=$D" >> "$GITHUB_ENV"
          echo "Found: $D"

      - name: Fix build.gradle.kts (Properties import)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          F=app/build.gradle.kts
          if grep -q 'java\.util\.Properties()' "$F"; then
            sed -i 's/java\.util\.Properties()/Properties()/' "$F"
            sed -i '1i import java.util.Properties' "$F"
            echo "Patched $F"
          else
            echo "No patch needed"
          fi

      - name: Add Firebase config (optional)
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Firebase config added."
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without cloud sync."
          fi

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Vibely-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
