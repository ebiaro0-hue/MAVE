name: Build MAVE APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip project
        run: |
          Z=$(ls MAVE_*.zip | sort -V | tail -n 1)
          echo "Using $Z"
          unzip -q "$Z" -d project
      - name: Find Android folder
        run: |
          F=$(find project -name 'settings.gradle*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; exit 1; fi
          D=$(dirname "$F")
          echo "ANDROID_DIR=$D" >> $GITHUB_ENV
          echo "Found: $D"
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew :app:assembleDebug --stacktrace; else gradle :app:assembleDebug --stacktrace; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MAVE-debug-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
